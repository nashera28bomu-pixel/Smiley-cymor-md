name: Extract Zip to Root

# Trigger manually from the GitHub Actions tab (mobile-friendly: no PC needed).
# Upload your zip file to the repo root first (via GitHub's web "Add file" -> "Upload files"),
# then run this workflow and give it the exact filename.
on:
  workflow_dispatch:
    inputs:
      zip_filename:
        description: "Name of the zip file in the repo root (e.g. Rumionbot-main.zip)"
        required: true
        default: "Rumionbot-main.zip"
      delete_zip_after:
        description: "Delete the zip file after extracting?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify zip exists
        run: |
          if [ ! -f "${{ github.event.inputs.zip_filename }}" ]; then
            echo "::error::File '${{ github.event.inputs.zip_filename }}' not found in repo root."
            exit 1
          fi

      - name: Extract zip to a staging folder
        run: |
          mkdir -p __extracted__
          unzip -o "${{ github.event.inputs.zip_filename }}" -d __extracted__

      - name: Flatten single top-level folder (if present)
        run: |
          cd __extracted__
          entries=(*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            echo "Flattening top-level folder: ${entries[0]}"
            shopt -s dotglob
            mv "${entries[0]}"/* ../
          else
            shopt -s dotglob
            mv * ../
          fi

      - name: Clean up staging folder and zip
        run: |
          rm -rf __extracted__
          if [ "${{ github.event.inputs.delete_zip_after }}" = "true" ]; then
            rm -f "${{ github.event.inputs.zip_filename }}"
          fi

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: extract ${{ github.event.inputs.zip_filename }} to repo root"
            git push
          fi
